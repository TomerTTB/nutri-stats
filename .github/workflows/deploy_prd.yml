name: "deploy to prd"

on: 
  push:
     branches:
       - main
  workflow_dispatch:

jobs:
  build-and-deply:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: |
          npm ci
          
      - name: 🏗️ Build project
        run: npm run build

      - name: 🧪 Debug dist contents
        run: |
          echo "Listing dist directory:"
          ls -l dist
          
      - name: 📤 Upload dist via WebDAV using curl
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
      
          cd dist
      
          # Create directories first
          find . -type d | while read dir; do
            remote_path="https://baseecli.com:2078/${dir#./}"
            echo "📁 Creating directory: $remote_path"
            curl --silent --fail -X MKCOL \
              --user '${{ secrets.CPANEL_USER }}':'${{ secrets.CPANEL_PASS }}' \
              "$remote_path" || true  # Ignore if already exists
          done
      
            # Upload files
          find . -type f | while read file; do
            remote_path="https://baseecli.com:2078/${file#./}"
            echo "📤 Uploading file: $remote_path"
            curl --fail -T "$file" \
              --user '${{ secrets.CPANEL_USER }}':'${{ secrets.CPANEL_PASS }}' \
              "$remote_path"
          done